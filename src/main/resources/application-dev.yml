server:
  address: 0.0.0.0 # Other device can connect
  port: ${PORT:8088}
  servlet:
    session:
      cookie:
        same-site: strict

spring:
  application:
    name: VietBus
  datasource:
    url: ${DB_URL:jdbc:postgresql://ep-gentle-frog-a17gg7m0-pooler.ap-southeast-1.aws.neon.tech:5432/neondb?sslmode=require}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD:npg_MbB7R8YCcjEa}
    driver-class-name: org.postgresql.Driver
  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  main:
    web-application-type: servlet
  mail:
    host: smtp.gmail.com
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:tuannhat226@gmail.com}
    password: ${MAIL_PASSWORD:pwsa jeiq lmbq htkg}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  quartz:
    properties:
      org:
        quartz:
          threadPool:
            threadCount: ${QUARTZ_THREAD_COUNT:30}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
    consumer:
      group-id: vietbus-mail-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.vtn.dto.event
        spring.json.value.default.type: com.vtn.dto.event.TicketMailEvent
    listener:
      ack-mode: record
      concurrency: 3

logging:
  level:
    org.hibernate.SQL: OFF
